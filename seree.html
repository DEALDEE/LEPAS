<!DOCTYPE html>
<html lang="th">
<head>
<!-- สำหรับ iOS Safari และ Android -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta charset="UTF-8">
  <title>ดีลดีคาร์</title>
  <meta name="description" content="เราไม่ได้แค่เชื่อมต่อคุณกับรถ แต่เราคือ เกราะป้องกัน ที่ทำให้การซื้อรถมือสองของคุณเปลี่ยนจากเรื่องน่ากังวล ให้กลายเป็นเรื่องที่คุ้มค่าที่สุด">
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1Xccf57-ygoTI7LckNlrHqSdhB3LPmzKB" data-rh="true">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1Xccf57-ygoTI7LckNlrHqSdhB3LPmzKB">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/5.3.45/css/materialdesignicons.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden; 
      font-family: sans-serif;
      background-color: #ffffff;
    }

    /* ให้ iframe อยู่ด้านหลังสุดและเต็มจอ 100% ตั้งแต่แรก */
    #myFrame {
      position: fixed; 
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      border: 0;
      z-index: 1;
    }

    /* หน้าจอโหลดทับอยู่ด้านบนสุด และจะสไลด์ขึ้นไปซ่อนเมื่อพร้อม */
    #loading { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100dvh; 
      z-index: 9999; 
      background: linear-gradient(to bottom, #ffffff 0%, #DC2626 100%);
      transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.4s ease;
      transform: translateY(0);
      opacity: 1;
    }

    /* คลาสสั่งสไลด์ขึ้นและจางหาย */
    #loading.slide-up {
      transform: translateY(-100%);
      opacity: 0;
    }

    .aderaswefrcseer { 
      display: flex;
      flex-direction: column;
      align-items: center;  
      justify-content: center;
      height: 100%;
      margin: 0;
    }

    .sdwwrasdew {
      font-size: 20px; 
      font-weight: 100;
    }

    .profionatainer { 
      position: relative; 
      width: 200px; 
      height: 200px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    
    .circzxsevg { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      transform: rotate(-90deg); 
    }

    .circleaqwerbg { 
      fill: none; 
      stroke: #ddd; 
      stroke-width: 10; 
    }

    .imaswertox { 
        width: 170px; 
        height: 170px; 
        background: #ffdd0050; 
        padding: 5px;
        border-radius: 50%; 
        z-index: 1; 
    }

    .imgsdewsdewox {
      display: flex; 
      align-items: center;  
      gap: 10px;     
      font-size: 15px; 
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="loading">
   <div class="aderaswefrcseer">
    <div class="profionatainer">
        <svg class="circzxsevg">
            <circle class="circleaqwerbg" cx="100" cy="100" r="90"></circle>
        </svg>
        <img src="https://lh3.googleusercontent.com/d/1Xccf57-ygoTI7LckNlrHqSdhB3LPmzKB" class="imaswertox">
    </div>

      <div class="imgsdewsdewox">
        <span class="mdi mdi-loading mdi-spin sdwwrasdew"></span>
        <div>กำลังโหลดข้อมูลดีลดีคาร์....</div>
      </div>
    </div>
  </div>

  <iframe id="myFrame" src=""></iframe>

<script>
  (function() {
    let cacheBust = new Date().getTime();
    let link3 = "https://script.google.com/macros/s/AKfycbxGFkGpxt8o8dlHlzIHvyjWaA6gGRinuiI9u3HmEh5HOlX9Z8vzustztY-K-R-piws6/exec?seree=Somchai&page=รุ่น&t=" + cacheBust;

    let iframe = document.querySelector("#myFrame");
    let loadingDiv = document.querySelector("#loading");

    // สั่งยัด URL ให้ iframe โหลดทันทีตั้งแต่เริ่มต้น
    iframe.setAttribute("src", link3);

    // กำหนดเวลาให้หน้าจอโหลดสไลด์ขึ้นเปิดเว็บอัตโนมัติ (เช่น 1.8 วินาที ให้หลัง)
    // ทำให้ผู้ใช้เห็นโลโก้สวยๆ แวบหนึ่งแล้วเปิดเข้าเว็บทันทีโดยไม่ต้องรอ iframe.onload ที่ชอบค้าง
    setTimeout(function() {
      loadingDiv.classList.add("slide-up");
      
      // เอาออกจาก DOM หลังจากแอนิเมชันเลื่อนขึ้นจบ (0.5 วินาที)
      setTimeout(function() {
        loadingDiv.style.display = "none";
      }, 500);
    }, 1800); // ปรับลด/เพิ่มเวลาตรงนี้ได้ (1800 = 1.8 วินาที)
  })();
</script>

</body>
</html>
