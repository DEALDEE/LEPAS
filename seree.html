  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden; 
      font-family: sans-serif;
      background-color: #ffffff;
    }

    #myFrame {
      position: fixed; 
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      border: 0;
      z-index: 1000;
    }

    /* หน้าจอโหลดพร้อมอนิเมชันเลื่อนขึ้น */
    #loading { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100dvh; 
      z-index: 2000; /* อยู่เหนือ iframe ตอนโหลด */
      background: linear-gradient(to bottom, #ffffff 0%, #DC2626 100%);
      transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1); /* ความเร็วและจังหวะการเลื่อน */
      transform: translateY(0);
    }

    /* คลาสสั่งเลื่อนหน้าจอโหลดขึ้นไปซ่อนด้านบน */
    #loading.slide-up {
      transform: translateY(-100%);
    }

    .aderaswefrcseer { 
      display: flex;
      flex-direction: column;
      align-items: center;  
      justify-content: center;
      height: 100%;
      margin: 0;
    }

    .sdwwrasdew {
      font-size: 20px; 
      font-weight: 100;
    }

    .profionatainer { 
      position: relative; 
      width: 200px; 
      height: 200px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    
    .circzxsevg { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      transform: rotate(-90deg); 
    }

    .circleaqwerbg { 
      fill: none; 
      stroke: #ddd; 
      stroke-width: 10; 
    }

    .imaswertox { 
        width: 170px; 
        height: 170px; 
        background: #ffdd0050; 
        padding: 5px;
        border-radius: 50%; 
        z-index: 1; 
    }

    .imgsdewsdewox {
      display: flex; 
      align-items: center;  
      gap: 10px;     
      font-size: 15px; 
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="loading">
   <div class="aderaswefrcseer">
    <div class="profionatainer">
        <svg class="circzxsevg">
            <circle class="circleaqwerbg" cx="100" cy="100" r="90"></circle>
        </svg>
        <img src="https://lh3.googleusercontent.com/d/1Xccf57-ygoTI7LckNlrHqSdhB3LPmzKB" class="imaswertox">
    </div>

      <div class="imgsdewsdewox">
        <span class="mdi mdi-loading mdi-spin sdwwrasdew"></span>
        <div>กรุณารอสักครู่....</div>
      </div>
    </div>
  </div>

  <iframe id="myFrame" src=""></iframe>

<script>
  (function() {
    let cacheBust = new Date().getTime();
    let link3 = "https://script.google.com/macros/s/AKfycbxGFkGpxt8o8dlHlzIHvyjWaA6gGRinuiI9u3HmEh5HOlX9Z8vzustztY-K-R-piws6/exec?seree=Somchai&page=รุ่น&t=" + cacheBust;

    let iframe = document.querySelector("#myFrame");
    let loadingDiv = document.querySelector("#loading");

    // ฟังก์ชันสั่งสไลด์หน้าจอโหลดขึ้นด้านบน
    function slideUpLoading() {
      if (!loadingDiv.classList.contains("slide-up")) {
        loadingDiv.classList.add("slide-up");
        // ซ่อน element ถาวรหลังอนิเมชันจบ (0.6 วินาที)
        setTimeout(function() {
          loadingDiv.style.display = "none";
        }, 600);
      }
    }

    // เมื่อ iframe โหลดเสร็จ จะสั่งสไลด์ขึ้นทันที
    iframe.onload = function() {
      slideUpLoading();
    };

    // ระบบป้องกันค้าง (เผื่อโหลดนานเกิน 8 วินาที ให้บังคับสไลด์ขึ้นเอง)
    let timeoutId = setTimeout(function() {
      slideUpLoading();
    }, 8000);

    // เริ่มโหลด iframe
    iframe.setAttribute("src", link3);
  })();
</script>

</body>
</html>
