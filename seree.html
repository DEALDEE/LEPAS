  <style>
    html, body {

      padding: 0;
      height: 100%;

    }

    #myFrame {
      position: fixed; 
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      z-index: 1000;
    }

    .loadewarapoper {
      font-family: sans-serif;
      box-sizing: border-box;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 85vh;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 15px;
      gap: 20px;
    }

    .tranasfeontainer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px; 
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
    }

    .nasweasode {
      /* border: 2px solid #333; */
      padding: 8px 6px;
      border-radius: 8px;
      background: #f6b26b;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1; 
      min-width: 0;
      box-sizing: border-box;
      transition: border-color 0.3s ease;

    .nasweasode span.node-title {

      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .imageafsedery {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 80px; /* ล็อกความสูงให้เท่ากันทั้งซ้ายและขวา */
      min-width: 0;
      border-radius: 4px;
      overflow: hidden;
    }

    .imageafsedery img {
      width: 100%; 
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    /* กล่องแสดงไอคอนแหล่งที่มา */
    .source-icon-box {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;

      border-radius: 4px;
    }

    .source-icon-box .mdi {
      font-size: 46px;
    }

    .datasewrene {
      flex-shrink: 0; 
      width: 40px;
      height: 4px;
      background: #ddd;
      position: relative;
      overflow: hidden; 
      border-radius: 2px;
    }

    .loadixdswreext {
      color: #666;
      font-size: 13px;
      text-align: center;
      padding: 0 10px;
    }

    .dataswrdweac {
      position: absolute;
      top: 0;
      left: -30%;
      width: 30%;
      height: 100%;

      border-radius: 2px;
      animation: transfer 1.2s infinite linear;
    }

    @keyframes transfer {

<body>

<div class="loadewarapoper" id="loading">
  <div class="tranasfeontainer">
    <!-- ฝั่งซ้าย: แหล่งที่มา (Source) -->
    <div class="nasweasode" id="sourceNode">
      <span class="node-title" id="sourceName">กำลังตรวจสอบ...</span>
      <div class="imageafsedery" id="sourceVisual">
        <!-- รูปภาพหรือไอคอนแหล่งที่มาจะถูกสร้างด้วย JS -->
      </div>
    </div>

    <!-- เส้นแอนิเมชันตรงกลาง -->
    <div class="datasewrene">
      <div class="dataswrdweac"></div>
    </div>

    <!-- ฝั่งขวา: เว็บไซต์ปลายทาง (Destination) -->
    <div class="nasweasode" style="border-color: #004aad;">
      <span class="node-title" style="color: #004aad;">เลพาส นวมินทร์</span>
      <div class="imageafsedery" id="serverGallery"></div>
    </div>
  </div>

  <div class="loadixdswreext">
    <span class="mdi mdi-loading mdi-spin"></span> 
    <span id="loadingStatusText">กำลังเชื่อมต่อข้อมูลไปยังเว็บไซต์...</span>
  </div>
</div>

<iframe id="myFrame" src=""></iframe>

<script>
  // ฟังก์ชันตรวจจับแหล่งที่มา (Facebook, LINE, Google, ฯลฯ)
  function detectTrafficSource() {
    const ref = (document.referrer || "").toLowerCase();
    const ua = (navigator.userAgent || "").toLowerCase();
    const search = (window.location.search || "").toLowerCase();

    // 1. ตรวจสอบ LINE (แสดงเป็นรูปภาพเฉพาะของ LINE)
    if (ua.includes("line") || ref.includes("line.me") || search.includes("utm_source=line") || search.includes("openexternalbrowser")) {
      return {
        name: "LINE",
        image: "https://lh3.googleusercontent.com/d/1ydlTcLwVRH1YL_Sti7mrM3x0Ib5ztHMI",
        color: "#06C755",
        bg: "#e6f9ee"
      };
    }

    // 2. ตรวจสอบ Facebook
    if (ua.includes("fban") || ua.includes("fbav") || ref.includes("facebook.com") || ref.includes("fb.com") || search.includes("fbclid") || search.includes("utm_source=facebook")) {
      return {
        name: "Facebook",
        icon: "mdi-facebook",
        color: "#1877F2",
        bg: "#e8f1fe"
      };
    }

    // 3. ตรวจสอบ Google
    if (ref.includes("google.") || search.includes("gclid") || search.includes("utm_source=google")) {
      return {
        name: "Google",
        icon: "mdi-google",
        color: "#DB4437",
        bg: "#fce8e6"
      };
    }

    // 4. ตรวจสอบ TikTok
    if (ua.includes("tiktok") || ua.includes("musical_ly") || ref.includes("tiktok.com") || search.includes("ttclid")) {
      return {
        name: "TikTok",
        icon: "mdi-music-note",
        color: "#000000",
        bg: "#f0f0f0"
      };
    }

    // 5. ตรวจสอบ Instagram
    if (ua.includes("instagram") || ref.includes("instagram.com")) {
      return {
        name: "Instagram",
        icon: "mdi-instagram",
        color: "#E1306C",
        bg: "#fceaf0"
      };
    }

    // 6. กรณีเข้าโดยตรง หรือแหล่งที่มาอื่นๆ
    return {
      name: "เบราว์เซอร์",
      icon: "mdi-web",
      color: "#555555",
      bg: "#eeeeee"
    };
  }

  document.addEventListener("DOMContentLoaded", function () {
    // อัปเดตกล่องฝั่งซ้าย (แหล่งที่มา)
    const source = detectTrafficSource();
    const sourceNode = document.getElementById("sourceNode");
    const sourceName = document.getElementById("sourceName");
    const sourceVisual = document.getElementById("sourceVisual");
    const statusText = document.getElementById("loadingStatusText");

    sourceNode.style.borderColor = source.color;
    sourceName.textContent = source.name;
    sourceName.style.color = source.color;

    if (source.image) {
      sourceVisual.innerHTML = `<img src="${source.image}" alt="${source.name}">`;
    } else {
      sourceVisual.innerHTML = `
        <div class="source-icon-box" style="background-color: ${source.bg}; color: ${source.color};">
          <span class="mdi ${source.icon}"></span>
        </div>
      `;
    }

    statusText.textContent = `กำลังนำคุณจาก ${source.name} เข้าสู่เว็บไซต์ของเรา...`;

    // อัปเดตกล่องฝั่งขวา (รูปภาพจาก og:image)
    const ogImageMeta = document.querySelector('meta[property="og:image"]');
    if (ogImageMeta) {
      const imageUrl = ogImageMeta.getAttribute("content").trim();
      const gallery = document.getElementById("serverGallery");
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "เลพาส นวมินทร์";
      gallery.appendChild(img);
    }
  });
</script>
  
<script>
  (function() {
    let fullPath = window.location.pathname + window.location.search;
    
    // ตัดเครื่องหมาย / ตัวแรกสุดออก (ถ้ามี)
    if (fullPath.startsWith("/")) {
      fullPath = fullPath.substring(1);
    }
    
    // ตัดพารามิเตอร์ติดตามของโซเชียลออก (รองรับทั้ง ? และ &)
    fullPath = fullPath.split('&')[0];
    if (fullPath.startsWith('?fbclid=') || fullPath.startsWith('?gclid=') || fullPath.startsWith('?utm_') || fullPath.startsWith('?openExternalBrowser')) {
      fullPath = "";
    }
    
    let combinedId = fullPath;
    let cacheBust = new Date().getTime();
    
    let link3 = "https://script.google.com/macros/s/AKfycbwU9LGU2G5_bKi9TLJ0ewbQrVaffH6181rm4Xu47f2wbnex8oXZp0NRRN0wJleXZweyDQ/exec?seree=" + encodeURIComponent(combinedId) + "&cb=" + cacheBust;

    let iframe = document.querySelector("#myFrame");
    let loadingDiv = document.querySelector("#loading");

    iframe.onload = function() {
      loadingDiv.style.display = "none";
      iframe.style.display = "block";
    };

    let link = window.location.href;
    if (!link.includes("dealdee.github.io/index.html")) {
      iframe.setAttribute("src", link3);
    }
  })();
</script>
